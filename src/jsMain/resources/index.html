<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sai Bank App</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #101828; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .phone { width: min(390px, 100%); min-height: 760px; border: 10px solid #111827; border-radius: 42px; overflow: hidden; background: #f8fafc; box-shadow: 0 25px 70px rgba(15,23,42,.28); }
    .status { height: 34px; padding: 8px 18px 0; display:flex; justify-content:space-between; font-size:12px; font-weight:700; background:#fff; }
    .notch { width:90px; height:18px; border-radius:0 0 14px 14px; background:#111827; margin:-34px auto 16px; position:relative; z-index:2; }
    header { padding: 12px 20px 18px; background:#fff; }
    header h1 { margin:0; font-size:24px; }
    header p { margin:4px 0 0; color:#667085; font-size:13px; }
    main { padding:20px; min-height:620px; }
    .balance-card { padding:22px; border-radius:24px; background:linear-gradient(135deg,#172554,#1d4ed8); color:white; box-shadow:0 14px 30px rgba(29,78,216,.2); }
    .muted { color:#667085; font-size:13px; }.balance-card .muted { color:#dbeafe; }.balance { font-size:32px; font-weight:800; margin:8px 0; }.account { font-size:13px; opacity:.8; }
    .section-title { font-weight:800; margin:24px 0 12px; }
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }.actions button { min-height:76px; border:1px solid #e4e7ec; border-radius:18px; background:white; font-size:22px; cursor:pointer; }.actions span { display:block; font-size:11px; margin-top:7px; color:#475467; }
    .transaction,.profile-row { background:white; border-bottom:1px solid #eef2f6; padding:15px 14px; display:flex; justify-content:space-between; gap:12px; }.transaction strong { font-size:14px; }.credit { color:#079455; } small { color:#98a2b3; }
    .back { color:#175cd3; font-weight:700; cursor:pointer; margin-bottom:20px; }
    label { display:block; font-size:13px; font-weight:700; margin:14px 0 7px; } input { width:100%; padding:14px; border:1px solid #d0d5dd; border-radius:14px; font-size:16px; background:white; }
    .primary { width:100%; margin-top:20px; padding:15px; border:0; border-radius:14px; background:#175cd3; color:white; font-weight:800; cursor:pointer; }.message { margin-top:12px; font-size:13px; color:#175cd3; }
    .profile { text-align:center; padding:18px 0 12px; }.avatar { width:74px; height:74px; display:grid; place-items:center; margin:auto; border-radius:50%; background:#dbeafe; color:#175cd3; font-weight:900; font-size:24px; }.profile h2 { margin:12px 0 0; }
    .bottom { height:70px; background:white; border-top:1px solid #eaecf0; display:grid; place-items:center; color:#667085; font-size:12px; }
    @media (max-width:430px) { body { padding:0; } .phone { width:100%; min-height:100vh; border:0; border-radius:0; } }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>● ● ▰</span></div>
    <div class="notch"></div>
    <header><h1>SAI BANK</h1><p>Secure digital banking</p></header>
    <main id="app"></main>
    <div class="bottom">Protected demo • Kotlin web preview</div>
  </div>
  <script src="SaiBankApp.js"></script>
</body>
</html>
