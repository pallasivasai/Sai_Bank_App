name: Build SAI Bank Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Prepare public APK asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SAI-Bank-App.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAI-Bank-App-debug-APK
          path: SAI-Bank-App.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: SAI Bank App — Latest Android APK
          body: |
            Public Android APK build for SAI Bank App.
            Download SAI-Bank-App.apk and install it on an Android device.
            This is a debug build for testing, not a production banking application.
          prerelease: true
          make_latest: false
          files: SAI-Bank-App.apk
          overwrite_files: true
